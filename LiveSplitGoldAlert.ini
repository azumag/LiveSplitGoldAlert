; LiveSplit Gold Alert 設定ファイル
; このファイルは exe と同じフォルダに置いてください。
; 無い場合はスクリプト内のデフォルト値が使われます。
; エンコーディングは UTF-8 で保存してください（日本語のシーン名/ソース名もOK）。

[LiveSplit]
Host = 127.0.0.1
Port = 16834

[OBS]
; OBS → ツール → obs-websocket設定 でサーバーを有効化し、パスワードを確認してください
Host = 127.0.0.1
Port = 4455
Password =
; ゴールド動画ソースが配置されているシーン名
SceneName =
; 表示/非表示を切り替えるソース名
SourceName =

[General]
CheckInterval = 2000
AutoHideDelay = 10000
PlayBeepSound = false
DebugMode = false
